name: Desktop editor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron binary
        run: node desktop/node_modules/electron/install.js
      - name: Build terrain codec
        run: pnpm run build:terrain-codec
      - name: Check desktop host
        run: pnpm --dir desktop run check
      - name: Test desktop services
        run: pnpm --dir desktop run test
      - name: Test desktop renderer integration
        run: pnpm --dir frontend exec vitest run --coverage.enabled=false src/platform/desktop
      - name: Build desktop editor
        run: pnpm --dir desktop run package
      - name: Test Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --dir desktop test:e2e
      - name: Test Electron on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm --dir desktop test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: desktop/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
