name: Frontend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install native SDL build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev cmake ninja-build python3 zip unzip

      - name: Build game WASM bundles
        env:
          PANGEA_WASM_JOBS: "2"
        run: npm run build:games

      - name: Verify staged scripting WASM artifacts
        run: pnpm run check:scripting-wasm

      - name: Test native editor compatibility probes
        working-directory: .
        run: |
          cmake -S games/pangea-ports/shared/tests/editor_probe -B build/editor-probe-tests
          cmake --build build/editor-probe-tests --parallel 2
          ctest --test-dir build/editor-probe-tests --output-on-failure --no-tests=error

      - name: Build supported native scripting adapters
        working-directory: .
        env:
          PANGEA_NATIVE_JOBS: "2"
        run: ./scripts/build-pangea-ports.sh --target native

      - name: Test all eight native scripting adapters
        working-directory: .
        run: |
          for entry in \
            OttoMatic-Android:BUILD_TESTING \
            Bugdom-android:PANGEA_BUILD_GAMEPLAY_TESTS \
            Bugdom2-Android:PANGEA_BUILD_SCRIPT_TESTS \
            Nanosaur-android:PANGEA_BUILD_NATIVE_SCRIPT_TESTS \
            Nanosaur2-Android:PANGEA_BUILD_GAMEPLAY_TESTS \
            CroMagRally-Android:PANGEA_BUILD_SCRIPT_ADAPTER_TESTS \
            BillyFrontier-Android:BUILD_TESTING \
            MightyMike-Android:PANGEA_GAME_TESTS; do
            IFS=: read -r game test_option <<< "$entry"
            game_dir="games/pangea-ports/games/$game"
            cmake -S "$game_dir" -B "$game_dir/build" "-D$test_option=ON"
            cmake --build "$game_dir/build" --parallel 2
            ctest --test-dir "$game_dir/build" --output-on-failure --no-tests=error
          done

      - name: Test enemy admission with population limits enabled and disabled
        working-directory: .
        run: |
          for limits in OFF ON; do
            cmake -S games/pangea-ports/games/MightyMike-Android -B games/pangea-ports/games/MightyMike-Android/build -DPANGEA_GAME_TESTS=ON -DPANGEA_ENABLE_ENEMY_LIMITS="$limits"
            cmake --build games/pangea-ports/games/MightyMike-Android/build --target MikeEnemyLimitsTests --parallel 2
            ctest --test-dir games/pangea-ports/games/MightyMike-Android/build -R '^mike_enemy_limits$' --output-on-failure --no-tests=error
            cmake -S games/pangea-ports/games/Nanosaur-android -B games/pangea-ports/games/Nanosaur-android/build -DPANGEA_BUILD_NATIVE_SCRIPT_TESTS=ON -DPANGEA_ENABLE_ENEMY_LIMITS="$limits"
            cmake --build games/pangea-ports/games/Nanosaur-android/build --target nanosaur_enemy_admission_test --parallel 2
            ctest --test-dir games/pangea-ports/games/Nanosaur-android/build -R '^nanosaur_enemy_admission$' --output-on-failure --no-tests=error
            cmake -S games/pangea-ports/games/Nanosaur2-Android -B games/pangea-ports/games/Nanosaur2-Android/build -DPANGEA_BUILD_GAMEPLAY_TESTS=ON -DPANGEA_ENABLE_ENEMY_LIMITS="$limits"
            cmake --build games/pangea-ports/games/Nanosaur2-Android/build --target Nanosaur2EnemyAdmissionTests Nanosaur2DirectLevelModeTests --parallel 2
            ctest --test-dir games/pangea-ports/games/Nanosaur2-Android/build -R '^nanosaur2_(enemy_admission|direct_level_mode)$' --output-on-failure --no-tests=error
          done
          cmake -S games/pangea-ports/games/MightyMike-Android -B games/pangea-ports/games/MightyMike-Android/build -DPANGEA_ENABLE_ENEMY_LIMITS=OFF
          cmake -S games/pangea-ports/games/Nanosaur-android -B games/pangea-ports/games/Nanosaur-android/build -DPANGEA_ENABLE_ENEMY_LIMITS=OFF
          cmake -S games/pangea-ports/games/Nanosaur2-Android -B games/pangea-ports/games/Nanosaur2-Android/build -DPANGEA_ENABLE_ENEMY_LIMITS=OFF

      - name: Run shared scripting native and WASM conformance tests
        working-directory: .
        run: |
          cmake -S games/pangea-ports/shared/script -B build/pangea-script -DBUILD_TESTING=ON
          cmake --build build/pangea-script --parallel 2
          ctest --test-dir build/pangea-script --output-on-failure
          source games/pangea-ports/.emsdk/emsdk_env.sh
          emcmake cmake -S games/pangea-ports/shared/script -B build/pangea-script-wasm -DBUILD_TESTING=ON
          cmake --build build/pangea-script-wasm --parallel 2
          ctest --test-dir build/pangea-script-wasm --output-on-failure

      - name: Verify frontend test discovery
        run: pnpm run test:discovery

      - name: Check scripting lifetimes with sanitizers
        working-directory: .
        run: |
          cmake -S games/pangea-ports/shared/script -B build/pangea-script-sanitized \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/pangea-script-sanitized --parallel 2
          ctest --test-dir build/pangea-script-sanitized --output-on-failure --no-tests=error

      - name: Execute generated object parameters and starter controllers in Lua
        env:
          PANGEA_LUA_EXECUTABLE: ${{ github.workspace }}/build/pangea-script/PangeaLuaCli
        run: >-
          pnpm exec vitest run --coverage.enabled=false
          src/editor/subviews/scripts/scriptObjectParameterRuntime.test.ts
          src/editor/subviews/scripts/scriptOttoObjectStarterRuntime.test.ts

      - name: Verify scripting contract drift
        run: pnpm run check:scripting-contract

      - name: Verify deterministic scripting metadata generation
        run: pnpm run generate:scripting-contract-metadata | diff -u ../games/pangea-ports/shared/script/pangea_script_contract.h -

      - name: Verify deterministic scripting documentation generation
        run: |
          pnpm run generate:scripting-contract-documentation | diff -u <(sed -n '/<!-- BEGIN GENERATED SCRIPTING CONTRACT INDEX -->/,/<!-- END GENERATED SCRIPTING CONTRACT INDEX -->/p' ../games/pangea-ports/docs/lua-scripting.md) -

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: Run unit and Storybook tests with combined coverage
        run: |
          mkdir -p ../ci-test-results
          set +e
          pnpm run test:coverage:combined > ../ci-test-results/frontend-test-suite.log 2>&1
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "Frontend unit or Storybook tests failed (exit $test_status)."
            echo "Failure summary:"
            grep -n -C 2 -E "FAIL|FAILED|AssertionError|Unhandled Error|Error:|Test Files|Tests|Coverage was not generated" \
              ../ci-test-results/frontend-test-suite.log | tail -160 || true
            exit "$test_status"
          fi
          echo "Frontend unit and Storybook tests passed."

      - name: Publish frontend test failure details
        if: failure()
        working-directory: .
        run: |
          {
            echo "## Frontend test failure details"
            echo
            echo 'The full test log is available in the `frontend-test-failure-log` artifact.'
            echo
            echo '### Failure summary'
            echo '```text'
            grep -n -E "FAIL|AssertionError|Error:|Test Files|Tests|Coverage was not generated" ci-test-results/frontend-test-suite.log | tail -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-failure-log
          path: ci-test-results/frontend-test-suite.log
          if-no-files-found: ignore

      - name: Upload frontend coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage
            frontend/coverage-storybook
            frontend/coverage-combined
          if-no-files-found: error

      - name: Audit item parameter citations
        run: pnpm run audit:item-citations

      - name: Build project
        if: success()
        run: pnpm run build

      - name: Run scripting WebAssembly launch matrix
        if: success()
        run: pnpm exec playwright test --config playwright.runtime.config.ts --workers=1

      - name: Run real-WASM multiplayer browser smoke tests
        if: success()
        continue-on-error: true
        env:
          VITE_MULTIPLAYER_ENABLED: "true"
          VITE_SCRIPTING_ENABLED: "false"
        run: pnpm exec playwright test tests/e2e/multiplayerGameLaunch.spec.ts tests/e2e/multiplayerShell.spec.ts --project=chromium --workers=1

      - name: Report test results
        if: always()
        run: echo "Frontend tests completed with status ${{ job.status }}"
