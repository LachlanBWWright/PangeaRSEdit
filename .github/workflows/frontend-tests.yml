name: Frontend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_MULTIPLAYER_CONTENT_HASH: ${{ github.sha }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Run tests
        run: pnpm test -- --run

      - name: Audit item parameter citations
        run: pnpm run audit:item-citations

      - name: Build project
        if: success()
        run: pnpm run build

      - name: Install Chromium for multiplayer smoke tests
        if: success()
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-WASM multiplayer browser smoke tests
        if: success()
        run: pnpm exec playwright test tests/e2e/multiplayerGameLaunch.spec.ts tests/e2e/multiplayerShell.spec.ts --project=chromium --workers=1

      - name: Report test results
        if: always()
        run: echo "Frontend tests completed with status ${{ job.status }}"
