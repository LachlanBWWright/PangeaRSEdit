name: Android Button Screenshots

on:
  workflow_dispatch:
    inputs:
      ports_ref:
        description: Pangea Ports revision containing shared/android touch controls
        required: true
        default: lua-cross-level-updates
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.matrix.outputs.games }}
      ports_sha: ${{ steps.matrix.outputs.ports_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LachlanBWWright/Pangea-Ports
          ref: ${{ inputs.ports_ref }}
          path: screenshot-ports
      - name: Prepare all eight games
        id: matrix
        run: |
          test -f screenshot-ports/shared/android/TouchControlsDraw.c
          test "$(python3 screenshot-ports/scripts/ports.py list | wc -l)" -eq 8
          echo "games=$(python3 screenshot-ports/scripts/ports.py matrix native)" >> "$GITHUB_OUTPUT"
          echo "ports_sha=$(git -C screenshot-ports rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  capture:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: LachlanBWWright/Pangea-Ports
          ref: ${{ needs.prepare.outputs.ports_sha }}
          submodules: recursive
          path: screenshot-ports
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install screenshot dependencies
        run: |
          python3 -m pip install -r scripts/android-screenshot-harness/requirements.txt
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.31.6"
      - name: Test image validation
        run: python3 -m unittest discover -s scripts -p 'test_android_button_*.py'
      - name: Record exact game revision
        run: |
          mkdir -p screenshots
          git -C screenshot-ports rev-parse HEAD > screenshots/ports-revision.txt
      - name: Build screenshot APK
        env:
          GAME: ${{ matrix.name }}
        run: bash scripts/build-android-screenshot-apk.sh screenshot-ports "$GAME" "$RUNNER_TEMP/game.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android gameplay and buttons
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GAME: ${{ matrix.name }}
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/capture-android-screenshot-set.sh "$GAME" "$RUNNER_TEMP/game.apk" screenshots screenshot-ports
      - name: Upload screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-buttons-${{ matrix.name }}
          path: screenshots
          if-no-files-found: error
