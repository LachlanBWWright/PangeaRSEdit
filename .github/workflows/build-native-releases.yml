name: Build Native Game Releases

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-releases-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      native-games: ${{ steps.games.outputs.native }}
      wasm-games: ${{ steps.games.outputs.wasm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test native package validation
        run: |
          python3 -m unittest discover -s scripts -p 'test_native_packages.py'
          python3 -m unittest discover -s scripts -p 'test_editor_game_catalog.py'
      - name: Prepare game matrices
        id: games
        run: |
          test "$(python3 games/pangea-ports/scripts/ports.py list | wc -l)" -eq 8
          echo "native=$(python3 games/pangea-ports/scripts/ports.py matrix native)" >> "$GITHUB_OUTPUT"
          echo "wasm=$(python3 games/pangea-ports/scripts/ports.py matrix wasm)" >> "$GITHUB_OUTPUT"

  build-wasm:
    needs: prepare-matrix
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.wasm-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Restore game WASM cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: frontend/public/generated/pangea-ports/wasm
          key: game-wasm-${{ runner.os }}-emscripten-3.1.74-${{ matrix.name }}-${{ hashFiles(format('games/pangea-ports/{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-wasm-${{ runner.os }}-emscripten-3.1.74-${{ matrix.name }}-
      - name: Build game WASM bundles
        env:
          PANGEA_WASM_JOBS: "1"
        run: pnpm --dir frontend run build:games --game "${{ matrix.name }}"
      - name: Upload game WASM bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-game-wasm
          path: frontend/public/generated/pangea-ports/wasm
          if-no-files-found: error

  build-linux:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev libfuse2 cmake ninja-build python3 zip unzip desktop-file-utils
      - name: Build Linux AppImage
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.AppImage "$RUNNER_TEMP/${{ matrix.name }}-linux.AppImage"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-linux
          path: ${{ runner.temp }}/${{ matrix.name }}-linux.AppImage
          if-no-files-found: error

  build-macos:
    needs: prepare-matrix
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build macOS DMG
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.dmg "$RUNNER_TEMP/${{ matrix.name }}-mac.dmg"
          app_bundle=$(find build -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$app_bundle"
          ditto -c -k --keepParent "$app_bundle" "$RUNNER_TEMP/${{ matrix.name }}-mac.zip"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-macos
          path: ${{ runner.temp }}/${{ matrix.name }}-mac.dmg
          if-no-files-found: error
      - name: Upload portable macOS runtime
        uses: actions/upload-artifact@v4
        with:
          name: editor-macos-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}-mac.zip
          if-no-files-found: error

  build-windows:
    needs: prepare-matrix
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Windows ZIP
        shell: bash
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.zip "$RUNNER_TEMP/${{ matrix.name }}-windows.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-windows
          path: ${{ runner.temp }}/${{ matrix.name }}-windows.zip
          if-no-files-found: error

  build-android:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build Android APK
        run: |
          cd "games/pangea-ports/${{ matrix.path }}/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/${{ matrix.name }}-android.apk"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-android
          path: ${{ runner.temp }}/${{ matrix.name }}-android.apk
          if-no-files-found: error

  publish-release:
    needs: [build-linux, build-macos, build-windows, build-android]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify all 32 release packages
        run: bash scripts/validate-native-packages.sh release-artifacts
      - name: Download portable macOS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: editor-macos-*
          merge-multiple: true
          path: desktop-artifacts
      - name: Build compatible runtime release catalog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python3 scripts/build_editor_game_catalog.py release-artifacts desktop-artifacts
      - name: Publish packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-artifacts/* desktop-artifacts/* --clobber

  deploy-pages:
    needs: [build-wasm, build-linux, build-macos, build-windows, build-android]
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Download game WASM bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "*-game-wasm"
          merge-multiple: true
          path: frontend/public/generated/pangea-ports/wasm
      - name: Build project
        env:
          VITE_API_ORIGIN: https://pangearsedit.onrender.com
          VITE_API_BASE_PATH: ""
          VITE_MULTIPLAYER_ENABLED: ${{ vars.MULTIPLAYER_ENABLED || 'true' }}
          VITE_SCRIPTING_ENABLED: "false"
          VITE_GAME_ASSET_VERSION: ${{ github.sha }}
        run: pnpm --dir frontend run build
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-artifacts
      - name: Add native packages to Pages site
        run: |
          rm -rf frontend/dist/games/pangea-ports frontend/dist/downloads
          bash scripts/validate-native-packages.sh release-artifacts frontend/dist/downloads
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
