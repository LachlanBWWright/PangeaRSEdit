name: Build Native Game Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: native-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      native-games: ${{ steps.games.outputs.native }}
      wasm-games: ${{ steps.games.outputs.wasm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare game matrices
        id: games
        run: |
          echo "native=$(python3 games/pangea-ports/scripts/ports.py matrix native)" >> "$GITHUB_OUTPUT"
          echo "wasm=$(python3 games/pangea-ports/scripts/ports.py matrix wasm)" >> "$GITHUB_OUTPUT"

  build-wasm:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.wasm-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Restore game WASM cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: frontend/public/generated/pangea-ports/wasm
          key: game-wasm-${{ runner.os }}-emscripten-3.1.74-${{ matrix.name }}-${{ hashFiles(format('{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-wasm-${{ runner.os }}-emscripten-3.1.74-${{ matrix.name }}-
      - name: Build game WASM bundles
        env:
          PANGEA_WASM_JOBS: "1"
        run: pnpm --dir frontend run build:games --game "${{ matrix.name }}"
      - name: Upload game WASM bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-game-wasm
          path: frontend/public/generated/pangea-ports/wasm
          if-no-files-found: error

  build-linux:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev cmake ninja-build python3 zip unzip desktop-file-utils
      - name: Restore Linux package cache
        id: linux-package-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.name }}-linux.AppImage
          key: game-package-linux-22.04-${{ matrix.name }}-${{ hashFiles(format('{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-package-linux-22.04-${{ matrix.name }}-
      - name: Build Linux AppImage
        if: steps.linux-package-cache.outputs.cache-hit != 'true'
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.AppImage "$RUNNER_TEMP/${{ matrix.name }}-linux.AppImage"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-linux
          path: ${{ runner.temp }}/${{ matrix.name }}-linux.AppImage
          if-no-files-found: error

  build-macos:
    needs: prepare-matrix
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore macOS package cache
        id: macos-package-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.name }}-mac.dmg
          key: game-package-macos-14-${{ matrix.name }}-${{ hashFiles(format('{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-package-macos-14-${{ matrix.name }}-
      - name: Build macOS DMG
        if: steps.macos-package-cache.outputs.cache-hit != 'true'
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.dmg "$RUNNER_TEMP/${{ matrix.name }}-mac.dmg"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-macos
          path: ${{ runner.temp }}/${{ matrix.name }}-mac.dmg
          if-no-files-found: error

  build-windows:
    needs: prepare-matrix
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Windows package cache
        id: windows-package-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.name }}-windows.zip
          key: game-package-windows-2022-${{ matrix.name }}-${{ hashFiles(format('{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-package-windows-2022-${{ matrix.name }}-
      - name: Build Windows ZIP
        if: steps.windows-package-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "games/pangea-ports/${{ matrix.path }}"
          python build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.zip "$RUNNER_TEMP/${{ matrix.name }}-windows.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows
          path: ${{ runner.temp }}/${{ matrix.name }}-windows.zip
          if-no-files-found: error

  build-android:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.native-games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Android package cache
        id: android-package-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.name }}-android.apk
          key: game-package-android-java17-${{ matrix.name }}-${{ hashFiles(format('{0}/**', matrix.path), 'games/pangea-ports/shared/**', 'games/pangea-ports/scripts/**', 'scripts/build-pangea-ports.sh') }}
          restore-keys: |
            game-package-android-java17-${{ matrix.name }}-
      - name: Build Android APK
        if: steps.android-package-cache.outputs.cache-hit != 'true'
        run: |
          cd "games/pangea-ports/${{ matrix.path }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease
          find app/build -name "*.apk" -exec cp {} "$RUNNER_TEMP/${{ matrix.name }}-android.apk" \;
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-android
          path: ${{ runner.temp }}/${{ matrix.name }}-android.apk
          if-no-files-found: error

  deploy-pages:
    needs: [build-wasm, build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Download game WASM bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "*-game-wasm"
          merge-multiple: true
          path: frontend/public/generated/pangea-ports/wasm
      - name: Build project
        env:
          VITE_API_ORIGIN: https://pangearsedit.onrender.com
          VITE_API_BASE_PATH: ""
          VITE_MULTIPLAYER_ENABLED: ${{ vars.MULTIPLAYER_ENABLED || 'true' }}
          VITE_SCRIPTING_ENABLED: "false"
          VITE_GAME_ASSET_VERSION: ${{ github.sha }}
        run: pnpm --dir frontend run build
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Add native packages to Pages site
        run: |
          rm -rf frontend/dist/games/pangea-ports frontend/dist/downloads
          mkdir -p frontend/dist/downloads
          find release-artifacts -mindepth 2 -maxdepth 2 -type f -print0 | while IFS= read -r -d '' file; do
            artifact_name=$(basename "$(dirname "$file")")
            case "$artifact_name" in
              *-linux) platform=linux ;;
              *-macos) platform=macos ;;
              *-windows) platform=windows ;;
              *-android) platform=android ;;
              *) echo "Unexpected artifact directory: $artifact_name" >&2; exit 1 ;;
            esac
            game_name="${artifact_name%-${platform}}"
            mkdir -p "frontend/dist/downloads/$game_name"
            cp "$file" "frontend/dist/downloads/$game_name/"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
