name: Build Native Game Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: native-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.games.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare native game matrix
        id: games
        run: echo "matrix=$(python3 games/pangea-ports/scripts/ports.py matrix native)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev cmake ninja-build python3 zip unzip
      - name: Build Linux AppImage
        run: |
          cd "${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.AppImage "$RUNNER_TEMP/${{ matrix.name }}-linux.AppImage"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-linux
          path: ${{ runner.temp }}/${{ matrix.name }}-linux.AppImage
          if-no-files-found: error

  build-macos:
    needs: prepare-matrix
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build macOS DMG
        run: |
          cd "${{ matrix.path }}"
          python3 build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.dmg "$RUNNER_TEMP/${{ matrix.name }}-mac.dmg"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-macos
          path: ${{ runner.temp }}/${{ matrix.name }}-mac.dmg
          if-no-files-found: error

  build-windows:
    needs: prepare-matrix
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Windows ZIP
        shell: bash
        run: |
          cd "${{ matrix.path }}"
          python build.py --dependencies --configure --build --package --dist-dir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/dist/"*.zip "$RUNNER_TEMP/${{ matrix.name }}-windows.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows
          path: ${{ runner.temp }}/${{ matrix.name }}-windows.zip
          if-no-files-found: error

  build-android:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.games) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android APK
        run: |
          cd "${{ matrix.path }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease
          find app/build -name "*.apk" -exec cp {} "$RUNNER_TEMP/${{ matrix.name }}-android.apk" \;
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-android
          path: ${{ runner.temp }}/${{ matrix.name }}-android.apk
          if-no-files-found: error

  deploy-pages:
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build game WASM bundles
        run: pnpm --dir frontend run build:games
      - name: Build project
        env:
          VITE_API_ORIGIN: ${{ vars.RAILWAY_API_ORIGIN }}
          VITE_API_BASE_PATH: ""
          VITE_MULTIPLAYER_ENABLED: ${{ vars.MULTIPLAYER_ENABLED || 'false' }}
          VITE_SCRIPTING_ENABLED: "false"
          VITE_MULTIPLAYER_CONTENT_HASH: ${{ github.sha }}
          VITE_GAME_ASSET_VERSION: ${{ github.sha }}
        run: pnpm --dir frontend run build
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Add native packages to Pages site
        run: |
          rm -rf frontend/dist/games/pangea-ports frontend/dist/downloads
          mkdir -p frontend/dist/downloads
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            artifact_name=$(basename "$(dirname "$file")")
            case "$artifact_name" in
              *-linux) platform=linux ;;
              *-macos) platform=macos ;;
              *-windows) platform=windows ;;
              *-android) platform=android ;;
              *) echo "Unexpected artifact directory: $artifact_name" >&2; exit 1 ;;
            esac
            game_name="${artifact_name%-${platform}}"
            mkdir -p "frontend/dist/downloads/$game_name"
            cp "$file" "frontend/dist/downloads/$game_name/"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
